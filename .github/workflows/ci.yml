name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build:packages
      - run: bun run typecheck
      - run: bun run --filter '@quiescent/web' build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      # devenv supplies a Nix-managed browser bundle locally; CI has no Nix,
      # so install just the chromium the specs use.
      - run: bunx playwright install --with-deps chromium
        working-directory: code/web
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: code/web/playwright-report/
          retention-days: 7
