name: release-please

on:
  push:
    branches: [main]
  # Manual catch-up publish when a release exists but its publish failed;
  # must live in this file because npm's trusted publisher is pinned to it.
  workflow_dispatch:
    inputs:
      paths:
        description: JSON array of package paths to publish
        required: true
        default: '["code/git","code/server","code/editor","code/astro","code/wiki"]'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      ${{ always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != '')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: bun publish exchanges the workflow's OIDC
      # token with the registry; no npm token is stored anywhere.
      id-token: write
    env:
      RELEASE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || needs.release-please.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Trusted publishing needs npm >= 11.5; the runner default can be older.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest
      # Release PRs must include the matching lockfile; never resolve new versions during publishing.
      - run: bun install --frozen-lockfile
      # quiescent-server depends on quiescent-git in-workspace; build
      # everything so cross-package type resolution works regardless of
      # which package is being published.
      - run: bun run build:packages
      - run: bun run check
      - run: node scripts/test-packages.mjs
      # Publish dependencies before dependents; retries skip versions already present.
      - run: node scripts/publish-packages.mjs
