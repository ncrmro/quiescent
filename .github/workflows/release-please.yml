name: release-please

on:
  push:
    branches: [main]
  # Manual catch-up publish when a release exists but its publish failed;
  # must live in this file because npm's trusted publisher is pinned to it.
  workflow_dispatch:
    inputs:
      paths:
        description: JSON array of package paths to publish
        required: true
        default: '["code/git","code/server","code/editor","code/astro","code/wiki"]'
        type: string

concurrency:
  group: quiescent-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: steps.release.outputs.pr != ''
      - uses: oven-sh/setup-bun@v2
        if: steps.release.outputs.pr != ''
        with:
          bun-version: 1.3.13
      - name: Update release lockfile and start CI
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          gh pr checkout "$RELEASE_PR"
          bun install --lockfile-only --ignore-scripts
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update release lockfile'
            git push
          fi
          gh workflow run ci.yml --ref "$(git branch --show-current)"

  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, validate]
    if: >-
      ${{ always() && needs.validate.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != '')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm publish exchanges the workflow's OIDC
      # token with the registry; no npm token is stored anywhere.
      id-token: write
    env:
      RELEASE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || needs.release-please.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Trusted publishing needs npm >= 11.5; the runner default can be older.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - name: Verify release tags match this checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs
      # Release PRs must include the matching lockfile; never resolve new versions during publishing.
      - run: bun install --frozen-lockfile
      # quiescent-server depends on quiescent-git in-workspace; build
      # everything so cross-package type resolution works regardless of
      # which package is being published.
      - run: bun run build:packages
      # Publish dependencies before dependents; retries skip versions already present.
      - run: node scripts/publish-packages.mjs
